<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4338ca" />
  <meta name="description" content="RoomConnect — verified boarding houses, dormitories and apartments near Central Mindanao University, Musuan, Bukidnon." />
  <title>RoomConnect · Verified Housing near CMU Musuan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
  <style>
    .rc-pin { background: none; border: none; }
    .leaflet-popup-content { margin: 12px; }
    .leaflet-popup-content-wrapper { border-radius: 14px; }
    .rc-popup p { margin: 0 0 2px; }
    .leaflet-control-layers { border-radius: 12px !important; font-family: Inter, sans-serif; font-size: 12px; }
  </style>
</head>
<body class="min-h-full bg-slate-50 font-sans text-slate-800 antialiased">
  <!-- ===== Header ===== -->
  <header class="sticky top-0 z-[1050] border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3">
      <a href="./" class="flex items-center gap-2">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-indigo-600 text-lg text-white">🏠</span>
        <span class="leading-tight">
          <span class="block text-base font-extrabold tracking-tight text-slate-900">RoomConnect</span>
          <span class="block text-[11px] font-medium text-slate-500">Verified housing near CMU Musuan</span>
        </span>
      </a>
      <div class="flex items-center gap-2">
        <a href="landlord.html" class="hidden rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 sm:inline-flex">For Landlords</a>
        <button id="auth-btn" type="button" class="rounded-lg bg-slate-900 px-3.5 py-2 text-sm font-semibold text-white active:scale-95">Sign in</button>
      </div>
    </div>
  </header>

  <!-- ===== Disclaimer banner ===== -->
  <div role="note" class="border-b border-amber-300 bg-amber-50">
    <div class="mx-auto flex max-w-7xl items-start gap-3 px-4 py-3">
      <span aria-hidden="true" class="mt-0.5 text-lg">⚠️</span>
      <p class="text-[13px] leading-snug text-amber-900">
        <strong class="font-bold">Important:</strong>
        RoomConnect assists with inquiries and reservations only. All payment settlements must be conducted directly with landlords.
      </p>
    </div>
  </div>

  <main class="mx-auto max-w-7xl px-4 pb-24 pt-4">
    <!-- ===== Search & filters ===== -->
    <section aria-label="Search and filters" class="space-y-3">
      <div class="flex gap-2">
        <label class="relative flex-1">
          <span class="sr-only">Search by name or address</span>
          <span class="pointer-events-none absolute inset-y-0 left-3 grid place-items-center text-slate-400">🔍</span>
          <input id="search" type="search" placeholder="Search name or street…" autocomplete="off"
            class="w-full rounded-xl border border-slate-300 bg-white py-3 pl-10 pr-3 text-base shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 sm:text-sm" />
        </label>
        <button id="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-panel"
          class="relative inline-flex items-center gap-1.5 rounded-xl border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-700 shadow-sm active:scale-95">
          ⚙️ <span>Filters</span>
          <span id="filter-badge" class="absolute -right-1.5 -top-1.5 hidden h-5 min-w-[1.25rem] place-items-center rounded-full bg-indigo-600 px-1 text-[11px] font-bold text-white"></span>
        </button>
      </div>

      <div id="filter-panel" class="hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <fieldset class="sm:col-span-2">
            <legend class="mb-1.5 text-xs font-semibold uppercase tracking-wide text-slate-500">Monthly price range (₱)</legend>
            <div class="flex items-center gap-2">
              <input id="min-price" type="number" inputmode="numeric" min="0" step="100" placeholder="Min"
                class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-base focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 sm:text-sm" />
              <span class="text-slate-400">–</span>
              <input id="max-price" type="number" inputmode="numeric" min="0" step="100" placeholder="Max"
                class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-base focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 sm:text-sm" />
            </div>
            <div id="price-presets" class="mt-2 flex flex-wrap gap-1.5">
              <button type="button" data-min="" data-max="1500" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-700 active:bg-slate-200">Under ₱1,500</button>
              <button type="button" data-min="1500" data-max="3000" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-700 active:bg-slate-200">₱1,500–3,000</button>
              <button type="button" data-min="3000" data-max="" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-700 active:bg-slate-200">₱3,000+</button>
            </div>
          </fieldset>

          <label class="block">
            <span class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">Property type</span>
            <select id="property-type" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-base focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 sm:text-sm">
              <option value="">All types</option>
              <option value="boarding_house">Boarding house</option>
              <option value="dormitory">Dormitory</option>
              <option value="apartment">Apartment</option>
            </select>
          </label>

          <label class="flex items-center justify-between gap-3 self-end rounded-lg bg-slate-50 px-3 py-2.5">
            <span class="text-sm font-medium text-slate-700">Available slots only</span>
            <input id="only-available" type="checkbox" checked class="h-5 w-5 accent-indigo-600" />
          </label>
        </div>

        <fieldset class="mt-4">
          <legend class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500">Amenities</legend>
          <div id="amenity-chips" class="flex flex-wrap gap-2"></div>
        </fieldset>

        <div class="mt-4 flex justify-end">
          <button id="reset-filters" type="button" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">Reset all filters</button>
        </div>
      </div>
    </section>

    <!-- ===== View Switcher (Map vs List) ===== -->
    <div class="mt-4 flex items-center justify-between">
      <p id="listing-count" class="text-sm font-medium text-slate-500">Loading listings…</p>
      <div role="tablist" class="flex rounded-xl bg-slate-200 p-1">
        <button role="tab" id="tab-split" aria-selected="true" class="rounded-lg bg-white px-3 py-1.5 text-xs font-bold text-slate-900 shadow-sm">Split Map</button>
        <button role="tab" id="tab-list" aria-selected="false" class="rounded-lg px-3 py-1.5 text-xs font-bold text-slate-600 hover:text-slate-900">List Only</button>
      </div>
    </div>

    <!-- ===== Main Grid / Map Split Layout ===== -->
    <div id="layout-grid" class="mt-3 grid gap-6 lg:grid-cols-12">
      <!-- Map Container -->
      <div id="map-container" class="lg:col-span-6">
        <div class="sticky top-20 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
          <div id="map" class="h-[420px] w-full sm:h-[520px]"></div>
        </div>
      </div>

      <!-- Listings Grid Container -->
      <div id="listings-container" class="lg:col-span-6">
        <div id="listings-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-1">
          <!-- Property cards will render here dynamically -->
        </div>
      </div>
    </div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Main App Script -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
